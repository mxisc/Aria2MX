name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64, target: linux-amd64}
          - {goos: linux, goarch: arm64, target: linux-arm64}
          - {goos: darwin, goarch: arm64, target: darwin-arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: go test ./...
      - run: |
          node scripts/prepare-aria2-runtime.mjs "$RUNTIME_TARGET"
          mkdir -p dist/release
          go build -trimpath -tags allinone -ldflags "-X aria2mx/internal/version.PanelVersion=$PANEL_VERSION" -o "dist/release/aria2mx-$RUNTIME_TARGET" ./cmd/aria2mx
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          RUNTIME_TARGET: ${{ matrix.target }}
          PANEL_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.0.0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: aria2mx-${{ matrix.target }}
          path: dist/release/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aria2mx-*
          merge-multiple: true
          path: release
      - run: gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
